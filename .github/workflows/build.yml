name: Build Mega Hub +

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (Windows, no .NET install needed)
        run: >
          dotnet publish src/MegaHubPlus.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: Smoke test (app must start, stay up and exit cleanly)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "out\MegaHubPlus.exe" -ArgumentList "--smoke-test" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "::error::app did not exit in 90 seconds"; exit 1 }
          Write-Host "exit code $($p.ExitCode)"
          if (Test-Path "$env:APPDATA\MegaHubPlus\logs\run.log") { Get-Content "$env:APPDATA\MegaHubPlus\logs\run.log" -Tail 20 }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.1.${{ github.run_number }}" installer\MegaHubPlus.iss

      - uses: actions/upload-artifact@v4
        with:
          name: MegaHubPlus-Setup
          path: installer-out/MegaHubPlus-Setup.exe

      - name: Attach installer to the Beta release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la installer-out || true
          set +e
          for i in 1 2 3; do
            out=$(gh release upload Beta installer-out/MegaHubPlus-Setup.exe --clobber --repo "${{ github.repository }}" 2>&1)
            code=$?
            echo "::warning title=release-upload::try=$i exit=$code $(echo "$out" | tr '\n' ' ' | cut -c1-300)"
            [ $code -eq 0 ] && exit 0
            sleep 10
          done
          exit 1
