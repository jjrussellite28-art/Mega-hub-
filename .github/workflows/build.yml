name: Build Mega Hub Plus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (Windows, no .NET install needed)
        run: >
          dotnet publish src/MegaHubPlus.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.1.${{ github.run_number }}" installer\MegaHubPlus.iss

      - uses: actions/upload-artifact@v4
        with:
          name: MegaHubPlus-Setup
          path: installer-out/MegaHubPlus-Setup.exe

      - name: Remove previous latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}"

      - name: Publish download link (latest build)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Mega Hub Plus (latest build)
          prerelease: true
          body: Latest automatic build. Unsigned for now, so Windows may warn or block it.
          files: installer-out/MegaHubPlus-Setup.exe
