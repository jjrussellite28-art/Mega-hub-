name: Build Mega Hub Plus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (Windows, no .NET install needed)
        run: >
          dotnet publish src/MegaHubPlus.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.1.${{ github.run_number }}" installer\MegaHubPlus.iss

      - uses: actions/upload-artifact@v4
        with:
          name: MegaHubPlus-Setup
          path: installer-out/MegaHubPlus-Setup.exe

      - name: Remove previous latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}"

      - name: Attach installer to the latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la installer-out || true
          set +e
          gh release create latest --prerelease --target "${{ github.sha }}" --title "Mega Hub Plus (latest build)" --notes "Latest automatic build. Unsigned for now, so Windows may warn or block it." --repo "${{ github.repository }}" 2>&1 | tr '\n' ' ' | cut -c1-300
          out=$(gh release upload latest installer-out/MegaHubPlus-Setup.exe --clobber --repo "${{ github.repository }}" 2>&1)
          code=$?
          echo "::warning title=release-upload::exit=$code $(echo "$out" | tr '\n' ' ' | cut -c1-400)"
          exit $code
