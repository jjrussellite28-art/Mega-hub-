name: Build Mega Hub Plus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (Windows, no .NET install needed)
        run: >
          dotnet publish src/MegaHubPlus.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - uses: actions/upload-artifact@v4
        with:
          name: MegaHubPlus-windows
          path: out/MegaHubPlus.exe
